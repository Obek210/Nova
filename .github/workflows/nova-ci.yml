name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: nova

jobs:
  export-android:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    containe:
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Configure Android and Java
        run: |
          mkdir -p ~/.config/godot
          cp -r /root/.config/godot/. ~/.config/godot/ 2>/dev/null || true
          godot --headless -e --quit || true
          S=$(ls ~/.config/godot/editor_settings-*.tres | head -n1)
          echo "Settings file: $S"
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which javac || which java))))
          echo "Java dir: $JAVA_DIR"
          sed -i '/^export\/android\/java_sdk_path/d' "$S"
          echo "export/android/java_sdk_path = \"$JAVA_DIR\"" >> "$S"
          if ! grep -q '^export/android/android_sdk_path' "$S"; then
            SDK=${ANDROID_HOME:-/usr/lib/android-sdk}
            echo "export/android/android_sdk_path = \"$SDK\"" >> "$S"
          fi
          if ! grep -q '^export/android/debug_keystore ' "$S"; then
            echo 'export/android/debug_keystore = "/root/debug.keystore"' >> "$S"
            echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$S"
            echo 'export/android/debug_keystore_pass = "android"' >> "$S"
          fi

      - name: Import assets
        run: godot --headless --verbose --import || true

      - name: Build APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/$EXPORT_NAME.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: build/android/*.apk
